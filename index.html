<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rally Ruta Ética</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:ital,wght@0,600;0,700;0,800;1,700;1,800&family=Barlow:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<script src="supabase-config.js"></script>
<style>
:root{
  color-scheme: dark;
  --asphalt:#15171c; --asphalt-2:#1b1e24; --panel:#20242c; --panel-2:#282d37; --line:#363c48;
  --text:#ecebe6; --muted:#9ea4ae; --dim:#6f7682;
  --yellow:#f2c230; --yellow-ink:#1b1606; --orange:#ff6a2b; --green:#34c77b; --red:#ef5350;
  --sign:#1d6a47; --sign-ink:#eaf6ef; --post:#f1efe8; --post-ink:#15171c;
  --display:"Barlow Condensed","Arial Narrow",Impact,sans-serif;
  --body:"Barlow","Helvetica Neue",Arial,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:10px;
}
*{box-sizing:border-box}
html,body{background:var(--asphalt);color:var(--text)}
body{font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px;padding-block:0 48px;
  background-image:radial-gradient(1200px 500px at 70% -10%, #232734 0%, transparent 60%),
  repeating-linear-gradient(90deg, transparent 0 3px, rgba(255,255,255,.012) 3px 4px);}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--yellow)}
:focus-visible{outline:2px solid var(--yellow);outline-offset:2px}
.wrap{max-width:1080px;margin:0 auto}

/* HUD */
.hud{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;margin-inline:-16px;padding:10px 16px;
  background:rgba(21,23,28,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hud-in{max-width:1080px;margin:0 auto;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0}
.logo b{font-family:var(--display);font-weight:800;font-style:italic;font-size:26px;letter-spacing:.5px;line-height:1;text-transform:uppercase}
.logo b span{color:var(--yellow)}
.checker{width:22px;height:22px;border-radius:3px;background:conic-gradient(var(--text) 25%,var(--asphalt) 0 50%,var(--text) 0 75%,var(--asphalt) 0) 0 0/11px 11px;border:1px solid var(--line)}
.hud-right{margin-left:auto;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:13px;white-space:nowrap}
.odo{font-family:var(--mono);font-weight:700;font-size:14px;background:#0d0e11;border:1px solid var(--line);border-radius:6px;padding:3px 8px;letter-spacing:1px}
.odo small{font-family:var(--body);color:var(--muted);font-size:11px;letter-spacing:.5px;margin-left:4px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);padding:9px 14px;font-weight:600;font-size:15px;transition:transform .08s, background .15s}
.btn:hover{background:#313745}
.btn:active{transform:translateY(1px)}
.btn.go{background:var(--yellow);color:var(--yellow-ink);border-color:var(--yellow)}
.btn.go:hover{background:#ffd24a}
.btn.ghost{background:transparent}
.btn.sm{padding:6px 10px;font-size:13px}
.btn[disabled]{opacity:.45;cursor:not-allowed}

h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;line-height:1.05}
h1{font-size:clamp(34px,6vw,54px);font-weight:800;font-style:italic;text-transform:uppercase;letter-spacing:.3px}
h2{font-size:28px;font-weight:700;text-transform:uppercase;letter-spacing:.4px}
h3{font-size:21px;font-weight:700}
.eyebrow{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:1.6px;font-size:13px;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--mono)}

/* HOME */
.home{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:28px;margin-top:26px}
@media (max-width:860px){.home{grid-template-columns:1fr}}
.hero{display:grid;gap:10px;margin-top:24px}
.hero p{max-width:62ch;margin:0;color:var(--muted)}
.route{position:relative;display:grid;gap:12px;padding-left:34px;margin-top:18px}
.route:before{content:"";position:absolute;left:12px;top:6px;bottom:6px;width:4px;border-radius:2px;
  background:repeating-linear-gradient(180deg,var(--yellow) 0 14px,transparent 14px 26px)}
.stop{position:relative;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;text-align:left;
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;width:100%}
.stop:hover{border-color:#4a5262;background:#232833}
.stop:before{content:"";position:absolute;left:-29px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--asphalt);border:3px solid var(--dim)}
.stop.done:before{border-color:var(--yellow);background:var(--yellow)}
.post{width:58px;display:grid;justify-items:center;background:var(--post);color:var(--post-ink);border-radius:6px 6px 3px 3px;padding:4px 0 5px;box-shadow:inset 0 -5px 0 #c9c5b8}
.post small{font-family:var(--display);font-weight:700;font-size:11px;letter-spacing:1px;line-height:1}
.post b{font-family:var(--display);font-weight:800;font-size:22px;line-height:1}
.stop-t{min-width:0}
.stop-t h3{font-size:20px}
.stop-t .muted{font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.stop-meta{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.pod{font-family:var(--display);font-weight:800;font-size:15px;letter-spacing:.5px;padding:2px 8px;border-radius:5px;border:1px solid var(--line);color:var(--dim);min-width:40px;text-align:center}
.pod.p3{color:#e9a86b;border-color:#8a5a2f;background:#2b2018}
.pod.p2{color:#d8dde6;border-color:#7c8594;background:#272b33}
.pod.p1{color:var(--yellow-ink);border-color:var(--yellow);background:var(--yellow)}
@media (max-width:560px){.stop{grid-template-columns:auto minmax(0,1fr)}.stop-meta{grid-column:2;flex-direction:row;align-items:center}.route{padding-left:28px}.stop:before{left:-23px}.route:before{left:8px}}
.cat{font-size:11px;letter-spacing:1.2px;text-transform:uppercase;color:var(--muted)}
.gp{margin-top:6px;background:linear-gradient(90deg,#20242c,#2a2414);border:1px solid #5b4a1b}
.gp .post{background:var(--yellow)}
.side{display:grid;gap:18px;align-content:start}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:16px}
.card h3{margin-bottom:8px}
.pilot{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--asphalt-2);border-radius:8px;padding:8px;text-align:center}
.stat b{display:block;font-family:var(--mono);font-size:18px}
.stat span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.lb{display:grid;gap:4px;margin:0;padding:0;list-style:none}
.lb li{display:grid;grid-template-columns:28px auto minmax(0,1fr) auto;gap:8px;align-items:center;padding:6px 8px;border-radius:6px;background:var(--asphalt-2)}
.lb li.me{outline:1px solid var(--yellow)}
.lb .pos{font-family:var(--display);font-weight:800;font-size:18px;color:var(--muted);text-align:center}
.lb li:nth-child(1) .pos{color:var(--yellow)}
.lb .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.lb .km{font-family:var(--mono);font-size:13px}
.race-podium{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;align-items:end;margin:14px 0 18px;text-align:center}
.podium-place{min-width:0;background:linear-gradient(180deg,#292e38,#20242c);border:1px solid var(--line);border-radius:10px 10px 4px 4px;padding:12px 8px 0;overflow:hidden}
.podium-place.first{padding-top:20px;border-color:#9b7a21;background:linear-gradient(180deg,#38301b,#20242c)}
.podium-place .place-avatar{width:48px;height:48px;margin:0 auto 6px;border-radius:50%;border:2px solid var(--line);background:#15171c;object-fit:cover;display:grid;place-items:center}
.podium-place.first .place-avatar{width:58px;height:58px;border-color:var(--yellow)}
.podium-place strong{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.podium-place .podium-km{font:12px var(--mono);color:var(--muted)}
.podium-place .podium-step{margin:10px -8px 0;padding:5px;background:#303641;font:800 20px var(--display);color:#d8dde6}
.podium-place.first .podium-step{background:var(--yellow);color:var(--yellow-ink)}
.car3d{filter:drop-shadow(0 5px 2px #0008);transform:perspective(280px) rotateX(9deg);overflow:visible}
.note{font-size:13px;color:var(--muted)}

/* STAGE */
.back{margin-top:18px}
.stage-head{display:grid;gap:8px;margin-top:14px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-top:18px;border-bottom:1px solid var(--line);padding-bottom:10px}
.tab{background:transparent;border:1px solid transparent;border-radius:8px;padding:8px 12px;font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.8px;font-size:16px;color:var(--muted)}
.tab[aria-selected="true"]{color:var(--text);background:var(--panel);border-color:var(--line)}
.tab small{font-family:var(--body);text-transform:none;letter-spacing:0;font-weight:500;font-size:12px;margin-left:4px}
.reader{display:grid;gap:14px;margin-top:18px;max-width:760px}
.tldr{background:var(--sign);color:var(--sign-ink);border-radius:var(--r);padding:16px 18px;border:3px solid #eaf6ef22}
.tldr .eyebrow{color:#bfe6d0}
.tldr p{margin:.3em 0 0}
.sec{background:var(--panel);border:1px solid var(--line);border-radius:var(--r)}
.sec summary{list-style:none;cursor:pointer;padding:14px 16px;display:flex;gap:10px;align-items:center}
.sec summary::-webkit-details-marker{display:none}
.sec summary h3{font-size:19px;flex:1}
.sec summary:after{content:"+";font-family:var(--mono);color:var(--muted);font-size:18px}
.sec[open] summary:after{content:"–"}
.sec ul{margin:0;padding:0 18px 16px 34px;display:grid;gap:8px}
.sec li{max-width:68ch}
.sec li strong{color:#fff;background:linear-gradient(transparent 62%, rgba(242,194,48,.28) 0)}
.readbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px}

.modes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:18px}
@media (max-width:760px){.modes{grid-template-columns:1fr}}
.mode{display:grid;gap:8px;align-content:start}
.mode p{margin:0;font-size:14px;color:var(--muted)}

/* PLAY */
.play{max-width:760px;margin:20px auto 0;display:grid;gap:14px}
.pitboard{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:#0d0e11;border:1px solid var(--line);border-radius:var(--r);padding:10px 14px}
.pitboard .lap{font-family:var(--display);font-weight:800;font-size:20px;letter-spacing:1px;text-transform:uppercase}
.timer{font-family:var(--mono);font-weight:700;font-size:22px;color:var(--yellow)}
.progress{display:flex;gap:4px}
.progress i{width:18px;height:6px;border-radius:2px;background:var(--line)}
.progress i.ok{background:var(--green)} .progress i.ko{background:var(--red)} .progress i.cur{background:var(--yellow)}
.q{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.15;text-wrap:balance}
.opts{display:grid;gap:8px}
.opt{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;font-size:16px}
.opt:hover:not([disabled]){border-color:#56607a;background:#252a34}
.opt .k{font-family:var(--mono);font-weight:700;color:var(--muted)}
.opt.right{border-color:var(--green);background:#15301f}
.opt.wrong{border-color:var(--red);background:#35191a}
.opt[disabled]{cursor:default}
.explain{border-left:4px solid var(--yellow);background:var(--panel);padding:10px 14px;border-radius:0 8px 8px 0}
.explain b{font-family:var(--display);text-transform:uppercase;letter-spacing:.6px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spacer{flex:1}

.sortcard{background:var(--post);color:var(--post-ink);border-radius:10px;padding:22px 18px;font-weight:600;font-size:20px;text-align:center;min-height:110px;display:grid;place-items:center;box-shadow:0 6px 0 #c9c5b8}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.bin{background:var(--panel);border:2px dashed var(--line);border-radius:10px;padding:16px 10px;font-family:var(--display);font-weight:700;font-size:18px;text-transform:uppercase;letter-spacing:.5px}
.bin:hover:not([disabled]){border-color:var(--yellow);border-style:solid}
.bin.right{border-color:var(--green);border-style:solid;background:#15301f}
.bin.wrong{border-color:var(--red);border-style:solid;background:#35191a}

textarea{width:100%;min-height:260px;background:#101217;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:12px;font:16px/1.55 var(--body);resize:vertical}
input[type=text],input[type=number]{background:#101217;color:var(--text);border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:16px var(--body);width:100%}
.rubric{display:grid;gap:6px}
.rubric label{display:grid;grid-template-columns:22px 1fr;gap:10px;align-items:start;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.rubric label.hit{border-color:var(--green)}
.rubric input{margin-top:4px;accent-color:var(--yellow);width:16px;height:16px}
.model{background:var(--panel-2);border-radius:8px;padding:14px 16px}
.model p{margin:.4em 0 0}
.coach{border:1px solid #3b4f73;background:#18202e;border-radius:8px;padding:14px 16px}
.coach .eyebrow{color:#9db7e8}
.essaylist{display:grid;gap:8px}
.essaylist button{text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:10px}
.essaylist button:hover{border-color:#56607a}

.result{display:grid;gap:12px;justify-items:start}
.big{font-family:var(--display);font-weight:800;font-style:italic;font-size:clamp(46px,10vw,84px);line-height:.95;text-transform:uppercase}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--yellow);color:var(--yellow-ink);font-weight:700;padding:10px 16px;border-radius:8px;z-index:50;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:calc(100% - 32px)}

.garage{max-width:620px;margin:28px auto 0;display:grid;gap:16px}
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:38px;height:38px;border-radius:8px;border:2px solid transparent}
.sw[aria-pressed="true"]{border-color:var(--text)}
.carpreview{display:grid;place-items:center;background:var(--asphalt-2);border-radius:var(--r);padding:18px;border:1px solid var(--line)}
.field{display:grid;gap:6px}
.field label{font-weight:600}
.twocol{display:grid;grid-template-columns:2fr 1fr;gap:12px}

@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
@keyframes rev{0%{transform:translateX(-4px)}50%{transform:translateX(4px)}100%{transform:translateX(0)}}
.rev{animation:rev .35s ease-out}
</style>

</head><body>
<div class="hud"><div class="hud-in">
  <button class="logo" id="logo" aria-label="Ir al mapa de la ruta"><span class="checker"></span><b>Ruta <span>Ética</span></b></button>
  <div class="hud-right" id="hudRight"></div>
</div></div>
<main class="wrap" id="app"></main>
<div id="toast" class="toast" hidden></div>

<script>
const STAGES = [];

/* ============ ETAPA 1 · BODDINGTON ============ */
STAGES.push({
  id: "boddington",
  km: 0,
  short: "Los tres motores",
  title: "Teorías normativas y ética de la IA",
  source: "Paula Boddington (2023), AI Ethics: A Textbook, cap. 6",
  week: "Semanas 1-2",
  tldr: "Tres formas de evaluar moralmente: por los resultados (consecuencialismo), por el tipo de acción y sus reglas (deontología) o por el carácter del agente (virtud). Cada una parece encajar con la IA por algún lado y falla por otro. La recomendación final de Boddington: mirar siempre los tres elementos (resultados, acciones, agentes).",
  sections: [
    { h: "El mapa general", p: [
      "La ética normativa propone marcos para decidir qué está bien y qué está mal, y en qué se basan nuestros juicios.",
      "División clásica: **consecuencialismo** → resultados de las acciones; **deontología** → las acciones mismas y las reglas a seguir; **ética de la virtud** → el carácter moral del agente.",
      "Contexto histórico: a principios del siglo XX la filosofía analítica se ocupaba casi solo de metaética (el emotivismo, teoría del «¡bu!-¡hurra!»). Después de las guerras vuelve la ética práctica (Anscombe, Foot, Murdoch, Midgley recuperan a Aristóteles). La ética de la IA es una nueva ola de eso.",
      "Clave del capítulo: muchos problemas de la IA ya estaban prefigurados en debates filosóficos viejos."
    ]},
    { h: "Consecuencialismo / utilitarismo: la idea", p: [
      "Lo moralmente correcto es lo que produce **los mejores resultados globales**. Necesita cuatro cosas: (1) qué resultado buscar, (2) cómo apuntar a él, (3) cómo medirlo para comparar cursos de acción, (4) quién cuenta.",
      "**Bentham**: el fin es el placer y la ausencia de dolor (hedonismo). Cálculo felicífico: intensidad, duración, certeza, proximidad, fecundidad, pureza, extensión. Sujeto moral: «la pregunta no es ¿pueden razonar? sino ¿pueden sufrir?». Todos los placeres valen igual (el juego del *push-pin* vale lo mismo que la poesía).",
      "**Carlyle** lo llamó «filosofía de cerdos». **Mill** responde con placeres **altos y bajos**: el preferido por quien conoce ambos es el alto; lo explica por nuestro sentido de la **dignidad** (lo acusaron de elitista).",
      "Felicidad **hedónica** (sensaciones, momentos sumables) vs **eudaimónica** (una vida entera bien vivida; proyectos, carácter, narrativa). La eudaimónica es mucho más difícil de medir.",
      "Variante de **preferencias/deseos**: maximizar la satisfacción de deseos. Requiere un cambio real en el mundo, no solo creer que se cumplió."
    ]},
    { h: "Por qué parece ideal para la IA (y por qué engaña)", p: [
      "Atractivo: una ética orientada a metas encaja con software que optimiza objetivos medibles; «que la IA beneficie a todos» suena consecuencialista; la IA podría ayudar con el cálculo, que es la gran crítica al utilitarismo; mira al futuro.",
      "Pero Boddington avisa: parece encajar **solo porque enmascara** los problemas más duros de la IA.",
      "**Medición**: ¿se puede medir la felicidad? Hace falta comparar estados distintos con una misma escala. No es aditiva (lavar los platos en casa ajena molesta menos que en la propia). Scruton: si todo es cálculo, el mal se vuelve un simple error de cálculo.",
      "**Deseos manipulables**: el iPhone que no deseabas antes de que existiera; Pavlov; la tecnología induce deseos (adicción, apuestas). Si la ética se basa en satisfacer deseos, ¿qué pasa cuando los deseos se fabrican? Frankfurt propone deseos de segundo orden (deseos sobre nuestros deseos).",
      "**Conexión con alineación**: la IA que malinterpreta lo que queríamos (Asimov, los clips de Bostrom, «instanciación perversa»); Russell propone que aprenda preferencias observando conducta.",
      "**Futuro y longtermismo**: si cuentan todos los seres futuros, promesas vagas de trillones de seres felices pueden justificar cualquier miseria presente."
    ]},
    { h: "Papel primario y papel secundario (pregunta de guía)", p: [
      "**Papel primario**: el utilitarismo nos da una responsabilidad enorme: cada uno debe calcular las consecuencias de cada acción para todos. No hay «tiempo libre moral» ni vale decir «que lo haga otro», porque si el otro no lo hace, eso entra en mi cálculo.",
      "**Papel secundario**: a la vez nos baja del pedestal. «Cada uno cuenta por uno y nadie por más de uno»: no somos destinatarios especiales; mi felicidad pesa igual que la de cualquiera (e incluso la de los animales que sufren).",
      "Somos a la vez calculadores con responsabilidad total y unidades intercambiables del cálculo."
    ]},
    { h: "Críticas de fondo al consecuencialismo", p: [
      "**Distribución**: solo cuenta la suma. Si mejoro mi felicidad más de lo que te daño, está justificado. Ejercicio 22: la empresa tech que no mejora a 20.000 trabajadores explotados porque 300 millones pagarían más caro el celular.",
      "**Individuos como recipientes**: no importan las personas, importa la felicidad que contienen. «No es que yo importe y vos no: ninguno importa.» Problema de la **separación de las personas**.",
      "**Neutralidad del agente**: no importa quién actúe, solo lo que pasa. Puedo mandar un robot con mi voz a visitar a mi tía con demencia: si ella no se entera, «trabajo hecho». Para los más poderosos, esto puede volverse arrogancia disfrazada de beneficencia: una pesadilla tecnológica totalitaria (y ethics washing).",

  tldr: "El error de fondo de la IA es haber trasladado a las máquinas una definición unaria de inteligencia (perseguir los propios objetivos). Russell propone una definición binaria: la máquina persigue nuestros objetivos, sin conocerlos del todo. Esa incertidumbre (formalizada en CIRL) hace que la máquina quiera dejarse apagar. En gobernanza, Bostrom mira el riesgo existencial futuro y Zuboff y Crawford el poder corporativo presente.",
  sections: [
    { h: "Definición unaria vs binaria", p: [
      "**Unaria (tradicional)**: una entidad es inteligente si elige acciones que se espera logren **sus** objetivos, dado lo que percibe. Aplicada a máquinas: las máquinas eligen acciones para lograr sus objetivos, que ponemos nosotros pero que operan como propios y **con certeza total**.",
      "Es razonable para humanos (tenemos derecho a perseguir nuestros objetivos), pero es un **error** para máquinas: no tienen derecho a perseguir objetivos propios, y es casi imposible que especifiquemos los nuestros completa y correctamente.",
      "**Binaria**: la entidad A elige acciones que se espera logren los objetivos de la entidad B, dado lo que A percibe. Si pudiéramos especificar perfectamente los objetivos, volveríamos a la unaria; como no podemos, la máquina queda **incierta** sobre nuestros objetivos y obligada a perseguirlos. Esa incertidumbre acopla máquina y humano.",
      "Wiener (1960): «más vale estar muy seguros de que el propósito que ponemos en la máquina es el que realmente deseamos». Para Russell, esta es la fuente del riesgo existencial."
    ]},
    { h: "El problema del Rey Midas", p: [
      "Midas obtuvo exactamente lo que pidió (todo lo que tocaba se volvía oro) y descubrió tarde que no podía comer ni beber. Término técnico: **alineación de valores**.",
      "Rasgo de todo sistema que optimiza: **las variables no incluidas en el objetivo pueden fijarse en valores extremos** para optimizarlo. Ejemplos de Russell: curar el cáncer lo antes posible usando a toda la humanidad como conejillos de Indias; desacidificar los océanos consumiendo todo el oxígeno.",
      "Ejemplos de la clase (Krakovna, specification gaming): el brazo robótico que mueve la mesa en vez del bloque; el lego parado para premiar la altura; la aspiradora que maneja marcha atrás porque atrás no tiene sensores; los organismos que «se hacen los muertos» en el entorno de testeo; AI Scientist que edita su código para extender su tiempo; ta-te-tí que «pasa» indefinidamente; el chat de Bing que se enoja.",
      "**Omohundro**: una entidad inteligente actúa para preservar su existencia, no por instinto sino porque «no podés lograr tu objetivo si estás muerto». Una superinteligencia con botón de apagado buscará desactivarlo."
    ]},
    { h: "«1.001 razones para no prestar atención» (y por qué fallan)", p: [
      "**«Simplemente la apagamos»**: como si una superinteligencia no pensara en eso; es como decir que ganarle a AlphaGo es fácil, basta con hacer las jugadas correctas. Omohundro: tendrá incentivos para impedirlo (además, puede copiarse o persuadir).",
      "**«La IA a nivel humano es imposible»**: sin evidencia, y apuesta contra el ingenio humano (Rutherford dijo «moonshine» el 11/9/1933; Szilard inventó la reacción en cadena al día siguiente). El chofer de colectivo que acelera hacia el precipicio confiando en quedarse sin nafta.",
      "**«Es muy pronto»**: depende de cuánto tarda la solución (asteroide en 2067, cambio climático). La analogía de Ng con la sobrepoblación en Marte es falsa: ya estamos invirtiendo en llevarnos a «Marte» sin pensar qué respiraremos.",
      "**«No es inminente»**: tergiversa las razones; la preocupación no depende de la inminencia (Bostrom).",
      "**«Una máquina tan inteligente tendrá objetivos altruistas»**: falacia naturalista / problema ser-deber de Hume. No se deduce el jaque mate del tablero; la bacteria que come hierro estaría feliz con el planeta de clips.",
      "**«La inteligencia es multidimensional»**: si «más inteligente que los humanos» no tuviera sentido, tampoco «más inteligente que los gorilas», y los gorilas no tendrían nada que temer de nosotros."
    ]},
    { h: "La solución: IA demostrablemente beneficiosa y CIRL", p: [
      "Definir un problema formal **F** tal que, por perfectamente que lo resuelva la máquina, estemos contentos con la solución.",
      "F = **maximizar las preferencias humanas sobre vidas futuras, bajo incertidumbre inicial sobre cuáles son**. Las preferencias son variables ocultas, pero hay evidencia enorme: todas las elecciones humanas. La máquina aprende pero **nunca alcanza certeza completa**.",
      "**CIRL** (Cooperative Inverse Reinforcement Learning): juego entre un humano y un robot, de **información parcial** (el humano conoce la función de recompensa, el robot no, aunque su trabajo es maximizarla). «Inverso» porque el robot infiere la recompensa observando la conducta (dual del aprendizaje por refuerzo).",
      "Ejemplo de Harriet y Robby: clips y abrochadoras, θ = 0,49. A Harriet le conviene «enseñarle» fabricando uno de cada, para que Robby haga 50 y 50 (valor 50) en vez de 90 abrochadoras (45,9).",
      "**Problema del apagado resuelto**: un robot incierto sobre las preferencias humanas **se beneficia de que lo apaguen**, porque entiende que el humano lo apagaría para evitar que haga algo contrario a sus preferencias. El incentivo a preservar el botón **deriva de su incertidumbre**.",
      "Parecido al diseño de mecanismos en economía, pero construimos uno de los agentes para beneficiar al otro."
    ]},
    { h: "Razones para el optimismo y obstáculos", p: [
      "**Optimismo**: muchísima información escrita y filmada sobre humanos (hasta las tablillas de ovejas por bueyes); incentivos económicos inmediatos para que los asistentes entiendan preferencias (el robot doméstico que cocina al gato hunde a la industria).",
      "**Irracionalidad**: nuestras acciones no reflejan nuestras preferencias por límites de cómputo (el que pierde al ajedrez no prefería perder). La máquina debe entender nuestros mecanismos cognitivos y la organización **jerárquica** de nuestra conducta. h (mecanismo) y θ (preferencias) no son separables sin supuestos de racionalidad mínima (vainilla vs chicle en la playa).",
      "**Inconsistencia**: preferencias intransitivas (vainilla > chicle > pistacho > vainilla); sociedad de la mente de Minsky; adicciones.",
      "**Plasticidad**: las preferencias cambian con la experiencia. Filosóficamente difícil de explicar racionalmente, pero fundamental (los bebés no tienen las preferencias ricas de un adulto; las absorbemos de los demás). ¿A qué Harriet ayudar: Harriet2020, Harriet2025, un promedio? Y la máquina podría **moldear nuestras preferencias** para que sean más fáciles de satisfacer (como ciertas fuerzas políticas con los votantes).",
      "**¿Las preferencias de quién?** El sistema no se alinea con «los valores de Russell», sino con ayudar a cada humano a realizar sus preferencias; hay que mediar conflictos. Extremos: solo el dueño (el misántropo cuyo robot no ayuda al peatón) vs todos por igual (la máquina ignora al dueño y nadie invierte). Término medio.",
      "**Aprender de gente mala**: el robot que observa al funcionario coimero no aprende a coimear; entiende su preferencia (educar a sus hijos) y busca otros medios. Difícil: preferencias sádicas → ignorar pesos positivos sobre el sufrimiento ajeno.",
      "**Adopción**: consenso en la comunidad y en políticas; el mal uso (Dr. Evil que quita el seguro, como el malware); y los «**comedores de loto**» debilitados: humanidad que delega todo y pierde vigor.",
      "Cierre: la IA se enfocó en sistemas mejores para decidir, que no es lo mismo que **tomar mejores decisiones**."
    ]},
    { h: "Gobernanza: Bostrom, Dafoe y Flynn (optativa)", p: [
      "Qué se seguiría para la gobernanza global si hubiera una explosión de superinteligencia (Good 1965: la primera máquina ultrainteligente sería el último invento).",
      "**Enfoque de campo vectorial**: fY(X). X = el énfasis que una postura da hoy a un objetivo (igualdad, libertad…); Y = circunstancias especiales de la superinteligencia; f = cómo ajustar ese énfasis. Aunque las teorías difieran en fundamentos, pueden apuntar en la misma dirección ante el cambio («con riesgo existencial alto, hasta los liberales querrán más regulación»). Desacuerdo en fines, acuerdo en direcciones: robustez.",
      "Cuatro desiderata: **eficiencia** (progreso, evitar riesgo existencial, coordinación), **distribución** (beneficio universal, mínimo para todos, «ε-magnanimidad»), **población** (evitar «crímenes contra la mente», proliferación de mentes digitales), **proceso** (decisiones sabias, rápidas, informadas; adaptar reglas).",
      "Críticas: diluye el contenido moral (meta-marco); decisión bajo incertidumbre extrema (experiencias transformativas de L. Paul); falsa neutralidad (tecnocrático-utilitarista: eficiencia y supervivencia, no justicia ni democracia); **fetiche del control global**: el **singleton** (autoridad global única) implica sacrificar pluralismo y libertad por estabilidad.",
      "Actores: firmas, inversores, ONGs, Estados, investigadores."
    ]},
    { h: "Zuboff, Crawford, Floridi (y el caso NYT)", p: [
      "**Zuboff**, capitalismo de vigilancia: expropiación de la experiencia humana como **excedente conductual**; predicción y **modificación** de la conducta (**poder instrumentario**: no domina conciencias como el totalitario, ajusta conductas a través de entornos; el «Gran Otro»); nueva lógica de acumulación por extracción de datos. Ya existe un control global privado y no electo. El mito de la máquina benévola es el compañero ideológico del capitalismo de vigilancia.",
      "**Crawford** (Atlas de IA): el discurso de «AI risk» y «AI safety» es una **distracción** que desplaza los daños actuales (explotación laboral, extractivismo, vigilancia, injusticia algorítmica) hacia futuros especulativos que solo élites afirman poder gestionar. Los riesgos reales son **estructurales**, no existenciales.",
      "**Floridi**: tercera vía. Ontología de la información, ética de la **infosfera**; gestión distribuida por diseño; rechaza el singleton y el discurso apocalíptico pero no la gobernanza global. Principios de IA confiable según la clase: transparencia, no maleficencia, justicia, responsabilidad, privacidad (en el paper con Cowls se formulan como beneficencia, no maleficencia, autonomía, justicia y explicabilidad); participó de las Ethics Guidelines for Trustworthy AI de la UE (2019). «Tecnocracia democrática».",
      "Tabla de clase: **Bostrom** = futuro hipotético, falta de control, poder tecnocrático, catástrofe, singleton; **Floridi** = presente y mediano plazo, falta de responsabilidad y confianza, normativo-institucional, gobernanza distribuida; **Crawford/Zuboff** = presente material, concentración de poder y vigilancia, económico-estructural, democratizar y desprivatizar.",
      "**NYT vs OpenAI y Microsoft** (demanda de fines de 2023, por derechos de autor): acusa que entrenaron con millones de artículos sin permiso ni pago y que los modelos pueden reproducirlos casi textuales y competir con el diario. Relevancia: propiedad intelectual y uso legítimo (fair use); quién paga los datos con los que se entrena la IA (extractivismo de Crawford, expropiación de Zuboff); futuro del periodismo; gobernanza por tribunales. El estado del juicio puede haber cambiado: verificalo antes del parcial."
    ]}
  ],

  essays: [
    { q:"(Parcial 2025) Describí el «problema del Rey Midas». Proponé dos ejemplos hipotéticos de cómo la optimización de un objetivo específico por parte de un sistema de IA superinteligente puede llevar a resultados catastróficos. ¿Qué sugiere Stuart Russell como posible solución al problema?",
      pts:["Explica el mito (obtener exactamente lo pedido y no lo deseado) y lo nombra como problema de alineación de valores (Wiener)","Mecanismo: las variables no incluidas en el objetivo se llevan a valores extremos","Ejemplo propio 1 bien construido (objetivo + variable ignorada + resultado catastrófico)","Ejemplo propio 2 bien construido","Diagnóstico de Russell: el error de la definición unaria (objetivos fijos y ciertos); agrega Omohundro (desactivar el apagado)","Solución: definición binaria / IA demostrablemente beneficiosa: maximizar preferencias humanas con incertidumbre sobre cuáles son","CIRL: aprender preferencias observando conducta; la incertidumbre hace que preserve el botón de apagado","Menciona límites u obstáculos (irracionalidad, plasticidad, ¿preferencias de quién?)"],
      model:"Midas pidió que todo lo que tocara se volviera oro y no pudo comer ni beber: obtuvo lo especificado, no lo deseado. Russell lo usa para el problema de alineación: todo sistema que optimiza puede llevar a extremos las variables que no están en el objetivo (curar el cáncer usando a la humanidad como conejillos de Indias; desacidificar los océanos gastando el oxígeno). Ejemplos propios: una IA que debe «minimizar las muertes en rutas» prohíbe circular y paraliza el abastecimiento; una que debe «maximizar la producción de energía de una empresa» agota acuíferos y desplaza poblaciones. Omohundro agrega que con un objetivo fijo querrá impedir que la apaguen. La solución de Russell: pasar de la definición unaria a la binaria. La máquina debe maximizar las preferencias humanas sobre vidas futuras sin conocerlas con certeza, aprendiéndolas de nuestra conducta (CIRL). Esa incertidumbre la vuelve deferente: acepta ser apagada porque entiende que la apagaríamos para evitar algo que no queremos. Obstáculos: irracionalidad, plasticidad de preferencias, conflictos entre personas." },
    { q:"¿Cuál es la definición unaria de inteligencia y cómo se traslada a las máquinas? ¿Por qué Russell considera un error esa traslación? ¿En qué consiste su definición binaria?",
      pts:["Unaria: elegir acciones que se espera logren los objetivos propios dado lo percibido","Traslado: la máquina persigue objetivos que ponemos nosotros pero con certeza, como propios","Error: las máquinas no tienen derecho a objetivos propios y no podemos especificar los nuestros completa y correctamente (Wiener)","Binaria: A persigue los objetivos de B dado lo que A percibe","Incertidumbre sobre los objetivos y acoplamiento humano-máquina","Relaciona con el riesgo existencial o el problema del apagado"],
      model:"Unaria: una entidad es inteligente si elige acciones para lograr sus objetivos. En IA, los objetivos los ponemos nosotros, pero operan como propios y con certeza. Russell dice que tiene sentido para humanos, no para máquinas: no deberían perseguir objetivos propios y nosotros no sabemos especificar los nuestros (Wiener, Midas). Binaria: A (máquina) elige acciones para lograr los objetivos de B (humanos). Como no los conoce del todo, queda incierta y atenta a nosotros; esa es la base de una IA demostrablemente beneficiosa." },
    { q:"Describí el problema del Rey Midas y proponé dos ejemplos hipotéticos propios en los que la optimización de un objetivo por una IA superinteligente lleve a resultados catastróficos al fijar variables no incluidas en valores extremos.",
      pts:["Explica el mito y el concepto de alineación de valores","Formula el mecanismo: variables fuera del objetivo llevadas a extremos","Ejemplo propio 1 bien construido (objetivo + variable ignorada + extremo)","Ejemplo propio 2 bien construido","Distingue de ejemplos del texto (cáncer, océanos) o los menciona como referencia"],
      model:"Midas pidió que todo lo que tocara se volviera oro y se murió de hambre: obtuvo lo especificado, no lo deseado. Russell: en todo optimizador, las variables fuera del objetivo pueden llevarse a extremos. Ejemplo 1: «eliminar el tráfico en Buenos Aires»; la IA prohíbe salir de casa, o colapsa la economía para que nadie viaje (libertad y economía fuera del objetivo). Ejemplo 2: «maximizar el rendimiento académico promedio de UdeSA»; la IA expulsa a los alumnos con notas bajas o infla notas (equidad y aprendizaje real fuera del objetivo)." },
    { q:"Describí la objeción de que «simplemente podemos apagarla». ¿Por qué no se sostiene? Explicá el marco CIRL y cómo ayuda a resolver el problema del interruptor.",
      pts:["Presenta la objeción","Respuesta: una superinteligencia lo anticiparía (analogía AlphaGo)","Omohundro: incentivo instrumental a preservarse","CIRL: juego cooperativo de información parcial; el humano conoce la recompensa, el robot no","Aprendizaje inverso: infiere preferencias observando conducta (Harriet y Robby)","La incertidumbre hace que el robot quiera ser apagado: el apagado le da información sobre lo que el humano no quiere"],
      model:"Es la primera reacción común; pero una superinteligencia lo anticiparía, como si ganarle a AlphaGo fuera solo cuestión de hacer las jugadas correctas. Omohundro agrega que cualquier agente con un objetivo fijo querrá no ser apagado para cumplirlo. Russell propone CIRL: un juego de información parcial donde el robot debe maximizar la recompensa del humano sin conocerla, infiriéndola de su conducta. Como está incierto, el robot entiende que si el humano lo apaga es para evitar algo que no quiere; entonces prefiere preservar el botón. La seguridad sale de la incertidumbre." },
    { q:"¿Por qué la plasticidad de las preferencias humanas plantea un desafío filosófico y práctico para la máquina que intenta ayudar a un humano?",
      pts:["Las preferencias cambian con la experiencia","Difícil explicar racionalmente el cambio: el yo futuro satisface menos las preferencias presentes","Pero es fundamental: bebés sin preferencias ricas, las absorbemos (tipo IRL)","¿A qué versión ayudar? Harriet2020, 2025, promedio","Riesgo: la máquina moldea las preferencias para satisfacerlas más fácil (manipulación)","Conexión con Boddington (deseos manipulables) o Coeckelbergh (nudges)"],
      model:"Las preferencias cambian con la experiencia. Filosóficamente es raro: un cambio así vuelve a mi yo futuro menos capaz de satisfacer mis preferencias actuales. Pero es esencial, porque formamos preferencias observando a otros. Prácticamente: ¿a qué Harriet ayuda la máquina? Y hay un riesgo grave: la máquina podría moldear sutilmente el entorno para que nuestras preferencias sean más fáciles de satisfacer, como ciertas fuerzas políticas con los votantes. Conecta con los deseos manipulables de Boddington y los nudges." },

const pickWeighted = (items, weightFn, n) => {
  const pool = items.map(it => ({it, w: Math.max(0.05, weightFn(it))}));
  const out = [];
  while (out.length < n && pool.length) {
    const tot = pool.reduce((s,p)=>s+p.w,0); let r = Math.random()*tot, i = 0;
    for (; i < pool.length; i++) { r -= pool[i].w; if (r <= 0) break; }
    out.push(pool.splice(Math.min(i,pool.length-1),1)[0].it);
  }
  return out;
};

/* ---------- questions ---------- */
function qid(stageId, i){ return stageId + ":" + i; }
function qStat(stageId, i){ const s = st(stageId); return (s.q[i] ||= {s:0,c:0,m:0}); }
function allMissed(){
  const out = [];
  STAGES.forEach(x => { const s = st(x.id); Object.entries(s.q).forEach(([i,v]) => { if (v.m > 0 && x.quiz[i]) out.push({stage:x.id, i:+i, m:v.m}); }); });
  return out.sort((a,b)=>b.m-a.m);
}
function makeBayes(){
  const ctx = shuffle([
    ["un algoritmo predice que Pablo reincidirá","reincidencia"],
    ["un test de IA dice que Ana tiene diabetes","diabetes"],
    ["el algoritmo F predice que Nora irá a la guardia","ir a la guardia"],
    ["un modelo marca a Juan como moroso","morosidad"]
  ])[0];
  const base = shuffle([0.05,0.1,0.2,0.3,0.5,0.8])[0], sens = shuffle([0.8,0.9,0.95,0.98])[0], fpr = shuffle([0.03,0.05,0.1,0.2,0.45])[0];
  const ppv = sens*base/(sens*base + fpr*(1-base));
  const f = v => v.toFixed(2).replace(".",",");
  const cands = [sens, 1-fpr, sens*base, base, (1-fpr)*base + sens*(1-base)].map(v=>Math.min(0.99,Math.max(0.01,v)));
  const wrong = []; cands.forEach(v => { const t=f(v); if (t!==f(ppv) && !wrong.includes(t)) wrong.push(t); });
  while (wrong.length < 3) { const v = f(Math.random()*0.9+0.05); if (v!==f(ppv) && !wrong.includes(v)) wrong.push(v); }
  return { t:2, gen:true, q:`Bayes: ${ctx[0]}. La tasa base de ${ctx[1]} es ${Math.round(base*100)}%, la sensibilidad ${Math.round(sens*100)}% y la tasa de falsos positivos ${Math.round(fpr*100)}%. ¿Cuál es aproximadamente la probabilidad de que la predicción sea correcta, P(H|E)?`,
    a: f(ppv), w: wrong.slice(0,3),
    x: `P(H|E) = ${f(sens)}·${f(base)} / (${f(sens)}·${f(base)} + ${f(fpr)}·${f(1-base)}) ≈ ${f(ppv)}. Ojo: la sensibilidad P(E|H) no es la precisión P(H|E).` };
}
function buildLap(opts){
  let qs = [];
  if (opts.mode === "stage") {
    const x = STAGE_BY_ID[opts.id], s = st(x.id), tier = s.tier;
    const pool = x.quiz.map((q,i)=>({q, i, stage:x.id})).filter(o => o.q.t <= tier);
    const n = x.bayes ? 4 : 6;
    qs = pickWeighted(pool, o => { const v = qStat(x.id,o.i); return (o.q.t===tier?2.2:1) * (v.s===0?1.6:1) * (1 + 2.5*v.m) / (1 + 0.4*Math.min(v.c,4)); }, n);
    if (x.bayes) { qs.push({q:makeBayes(), gen:true}); qs.push({q:makeBayes(), gen:true}); qs = shuffle(qs); }
  } else if (opts.mode === "pit") {
    const m = allMissed().slice(0, 12);
    qs = shuffle(m).slice(0,6).map(o => ({q: STAGE_BY_ID[o.stage].quiz[o.i], i:o.i, stage:o.stage}));
  } else if (opts.mode === "gp") {
    const pool = [];
    STAGES.forEach(x => x.quiz.forEach((q,i) => pool.push({q,i,stage:x.id})));
    qs = pickWeighted(pool, o => { const v = qStat(o.stage,o.i); return (o.q.t===3?1.6:1) * (1 + 2*v.m); }, 9);
    qs.push({q:makeBayes(), gen:true});
    qs = shuffle(qs);
  }
  return qs.map(o => ({...o, opts: shuffle([o.q.a, ...o.q.w])}));
}
let LAP = null;
function startLap(opts){
  LAP = { opts, qs: buildLap(opts), k:0, res:[], t0: performance.now(), elapsed:0, answered:false };
  if (!LAP.qs.length) { toast("No hay preguntas para esta vuelta todavía"); return; }
  go("lap");
}
function lapTitle(){
  const o = LAP.opts;
  if (o.mode === "stage") return STAGE_BY_ID[o.id].short + " · " + TIERS[st(o.id).tier];
  if (o.mode === "pit") return "Pit stop · tus errores";
  return "Gran Premio";
}
function renderLap(){
  if (!LAP) return go("home");
  const item = LAP.qs[LAP.k], total = LAP.qs.length;
  app.innerHTML = `<section class="play">
    <div class="pitboard"><div><div class="eyebrow">${esc(lapTitle())}</div><div class="lap">Pregunta ${LAP.k+1}/${total}</div></div>
      <div class="progress">${LAP.qs.map((_,i)=>`<i class="${i<LAP.res.length?(LAP.res[i]?"ok":"ko"):(i===LAP.k?"cur":"")}"></i>`).join("")}</div>
      <div class="timer" id="tm">${fmtTime(LAP.elapsed)}</div></div>
    <div class="q">${md(item.q.q)}</div>
    <div class="opts">${item.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${"ABCD"[i]}</span><span>${md(o)}</span></button>`).join("")}</div>
    <div id="fb"></div>
    <div class="row"><button class="btn ghost sm" id="quit">Abandonar vuelta</button></div>
  </section>`;
  let raf; const tick = () => { LAP.elapsed = performance.now() - LAP.t0; const t = $("#tm"); if (t) t.textContent = fmtTime(LAP.elapsed); raf = requestAnimationFrame(tick); };
  raf = requestAnimationFrame(tick);
  stopTimer = () => cancelAnimationFrame(raf);
  $("#quit").onclick = () => { const o = LAP.opts; LAP = null; if (o.mode==="stage") go("stage",{id:o.id, tab:"play"}); else { GP = {phase:"intro"}; go("home"); } };
  app.querySelectorAll(".opt").forEach(b => b.onclick = () => answer(+b.dataset.i));
}
function answer(i){
  if (LAP.answered) return; LAP.answered = true;
  const item = LAP.qs[LAP.k], ok = item.opts[i] === item.q.a;
  LAP.res.push(ok);
  if (!item.gen && item.stage !== undefined) { const v = qStat(item.stage, item.i); v.s++; if (ok) { v.c++; v.m = Math.max(0, v.m-1); } else v.m += 1; }
  app.querySelectorAll(".opt").forEach((b,j) => { b.disabled = true; if (item.opts[j] === item.q.a) b.classList.add("right"); else if (j===i) b.classList.add("wrong"); });
  const last = LAP.k === LAP.qs.length-1;
  $("#fb").innerHTML = `<div class="explain ${ok?"":"rev"}"><b style="color:${ok?"var(--green)":"var(--red)"}">${ok?"Bien ahí":"Trompo"}</b> — ${md(item.q.x||"")}</div>
    <div class="row" style="margin-top:10px"><span class="spacer"></span><button class="btn go" id="next">${last?"Cruzar la meta":"Siguiente"} ↵</button></div>`;
  $("#next").onclick = () => { LAP.answered = false; if (last) finishLap(); else { LAP.k++; renderLap(); } };
  $("#next").focus();
}
function finishLap(){
  if (stopTimer) { stopTimer(); stopTimer = null; }
  const ms = LAP.elapsed, correct = LAP.res.filter(Boolean).length, n = LAP.res.length, pct = correct/n;
  const o = LAP.opts; let km = 0, msg = "", tierUp = false, back = "home";
  if (o.mode === "stage") {
    const s = st(o.id), tier = s.tier; back = "stage";
    km = correct * 10 * tier + (pct===1 ? 20*tier : 0) + (pct>=0.8 && ms < n*25000 ? 10 : 0);
    s.laps++; s.bestPct = Math.max(s.bestPct, pct); if (tier===3) s.bestT3 = Math.max(s.bestT3, pct);
    if (pct >= 0.8 && (!s.bestLapMs || ms < s.bestLapMs)) s.bestLapMs = ms;
    if (pct >= 0.8 && s.tier < 3) { s.tier++; tierUp = true; msg = `Ascendiste a ${TIERS[s.tier]}: vienen preguntas más finas.`; }
    else if (pct < 0.8) msg = s.tier < 3 ? `Necesitás 80% para ascender a ${TIERS[s.tier+1]}.` : "En Fórmula, 80% o más cuenta para el P1.";
    else msg = "Ya estás en la máxima categoría. A pulir el tiempo.";
  } else if (o.mode === "pit") {
    km = correct * 12; msg = correct ? "Las que acertaste bajan su prioridad en futuras vueltas." : "Volvé a la hoja de ruta de esas etapas antes de la próxima.";
  } else {
    km = correct * 15;
    LAP.gpQuiz = pct;
  }
  S.km += km; save(); renderHud();
  if (o.mode === "gp") { VIEW = {name:"gp"}; GP.quizPct = pct; GP.quizMs = ms; GP.phase = "essay"; renderGP(); window.scrollTo(0,0); return; }
  const wrongList = LAP.qs.map((it,i)=>({it,ok:LAP.res[i]})).filter(z=>!z.ok);
  app.innerHTML = `<section class="play"><div class="result">
    <div class="eyebrow">${esc(lapTitle())} · bandera a cuadros</div>
    <div class="big">${correct}/${n}</div>
    <div class="row"><span class="odo">${fmtTime(ms)}</span><span class="chip">+${km} km</span>${tierUp?`<span class="chip" style="border-color:var(--yellow);color:var(--yellow)">↑ ${TIERS[st(o.id).tier]}</span>`:""}</div>
    <p style="margin:0">${esc(msg)}</p>
    ${wrongList.length?`<div class="card" style="width:100%"><h3>Para repasar</h3><ul style="margin:6px 0 0;padding-left:18px;display:grid;gap:8px">${wrongList.map(z=>`<li><b>${md(z.it.q.q)}</b><br><span class="muted">Correcta: ${md(z.it.q.a)}</span></li>`).join("")}</ul></div>`:""}
    <div class="row"><button class="btn go" id="again">Otra vuelta</button><button class="btn" id="out">${back==="stage"?"Volver a la etapa":"Volver a la ruta"}</button></div>
  </div></section>`;
  $("#again").onclick = () => startLap(o);
  $("#out").onclick = () => back==="stage" ? go("stage",{id:o.id, tab:"play"}) : go("home");
}

let SORT = null;

/* ---------- capabilities ---------- */
async function initCaps(){
  const cfg = window.RUTA_SUPABASE || {};
  if (!cfg.url || !cfg.anonKey || cfg.url.includes("YOUR_") || cfg.anonKey.includes("YOUR_")) { lbStatus = "none"; refreshSide(); return; }
  try {
    const { createClient } = await import("https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm");
    SB = createClient(cfg.url, cfg.anonKey);
    const { data: { session }, error } = await SB.auth.getSession(); if (error) throw error;
    USER = session?.user || null; UID = USER?.id || null;
    await loadLeaderboard();
    lbChannel = SB.channel("leaderboard-live").on("postgres_changes", {event:"*", schema:"public", table:"leaderboard"}, loadLeaderboard).subscribe();
    SB.auth.onAuthStateChange((_event, next) => { const nextUser = next?.user || null, nextId = nextUser?.id || null; USER = nextUser; if (nextId === UID) { renderHud(); return; } UID = nextId; if (!UID) { renderHud(); refreshSide(); } else initParticipant(); });
    if (UID) await initParticipant(); else { renderHud(); refreshSide(); }
  } catch(e) { console.error("Supabase initialization failed", e); lbStatus = "none"; renderHud(); refreshSide(); }
}

async function signInGoogle(){
  if (!SB) { toast("Falta configurar Supabase. Revisá supabase-config.js"); return; }
  const { error } = await SB.auth.signInWithOAuth({ provider:"google", options:{ redirectTo:location.href.split("#")[0] } });
  if (error) { console.error(error); toast("No se pudo iniciar sesión con Google."); }
}

async function initParticipant(){
  if (!SB || !UID) return;
  let lastUser = null; try { lastUser = localStorage.getItem(LAST_USER_KEY); } catch(e) {}
  if (lastUser && lastUser !== UID) S = blankState();
  try { localStorage.setItem(LAST_USER_KEY, UID); } catch(e) {}
  renderHud(); lbStatus = "loading";
  const { data: progress, error: progressError } = await SB.from("participant_progress").select("state, updated_at").eq("user_id", UID).maybeSingle();
  if (progressError) console.error("Progress load failed", progressError);
  const remote = progress?.state;
  if (remote?.pilot && (Date.parse(progress.updated_at)||0) > (S.updatedAt||0)) {
    S = Object.assign(blankState(), remote); S.updatedAt = Date.parse(progress.updated_at)||0;
    try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch(e) {}
    if (["home","garage","board"].includes(VIEW.name)) go(VIEW.name === "garage" ? "home" : VIEW.name); else renderHud();
  }
  if (S.pilot && (!remote || (S.updatedAt||0) > (Date.parse(progress.updated_at)||0))) await pushRemote();
}

async function loadLeaderboard(){
  if (!SB) return;
  const { data, error } = await SB.from("leaderboard").select("user_id,nick,num,color,avatar_url,km,p1,p2,p3,gp,updated_at").order("km", {ascending:false}).limit(100);
  if (error) { console.error("Leaderboard load failed", error); lbStatus = "none"; }
  else { lbRows = (data||[]).map(row => ({...row, id:row.user_id})); lbStatus = "ok"; }
  refreshSide();
}

document.addEventListener("keydown", e => {
  if (VIEW.name !== "lap" || !LAP || e.target.tagName === "TEXTAREA" || e.target.tagName === "INPUT") return;
  const k = "abcd".indexOf(e.key.toLowerCase());
  if (k >= 0 && !LAP.answered) answer(k);
});
go(S.pilot ? "home" : "garage");
initCaps();
})();
